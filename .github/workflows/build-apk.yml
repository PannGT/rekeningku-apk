name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (dibutuhkan Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependency npm
        run: npm install

      - name: Tambah platform Android (Capacitor)
        run: npx cap add android

      - name: Generate icon & splash screen Android
        run: npx @capacitor/assets generate --android

      - name: Sync web app ke project Android
        run: npx cap sync android

      - name: Beri izin eksekusi gradlew
        run: chmod +x android/gradlew

      - name: Build APK (debug)
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: rekeningku-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
